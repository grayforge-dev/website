name: Notify IndexNow

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for IndexNow key deployment
        run: |
          curl --fail \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            https://grayforge.app/grayforge-indexnow-20260612.txt

      - name: Submit primary pages to IndexNow
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "grayforge.app",
              "key": "grayforge-indexnow-20260612",
              "keyLocation": "https://grayforge.app/grayforge-indexnow-20260612.txt",
              "urlList": [
                "https://grayforge.app/",
                "https://grayforge.app/dashlog/",
                "https://grayforge.app/noisyno/",
                "https://grayforge.app/vocalout/",
                "https://grayforge.app/blog/",
                "https://grayforge.app/blog/noisyno/",
                "https://grayforge.app/blog/vocalout/",
                "https://grayforge.app/blog/dashlog/",
                "https://grayforge.app/blog/dashlog/log-every-drive-automatically/",
                "https://grayforge.app/ja/blog/dashlog/log-every-drive-automatically/",
                "https://grayforge.app/de/blog/dashlog/log-every-drive-automatically/",
                "https://grayforge.app/blog/vocalout/remove-vocals-from-a-song/",
                "https://grayforge.app/ja/blog/vocalout/remove-vocals-from-a-song/",
                "https://grayforge.app/de/blog/vocalout/remove-vocals-from-a-song/",
                "https://grayforge.app/blog/noisyno/remove-background-noise-from-voice-memo/",
                "https://grayforge.app/ja/blog/noisyno/remove-background-noise-from-voice-memo/",
                "https://grayforge.app/de/blog/noisyno/remove-background-noise-from-voice-memo/",
                "https://grayforge.app/blog/noisyno/clean-up-meeting-recording-audio/",
                "https://grayforge.app/ja/blog/noisyno/clean-up-meeting-recording-audio/",
                "https://grayforge.app/de/blog/noisyno/clean-up-meeting-recording-audio/",
                "https://grayforge.app/blog/noisyno/remove-audio-noise-without-upload/",
                "https://grayforge.app/ja/blog/noisyno/remove-audio-noise-without-upload/",
                "https://grayforge.app/de/blog/noisyno/remove-audio-noise-without-upload/"
              ]
            }' \
            https://api.indexnow.org/indexnow
