name: Notify IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate sitemap and page metadata
        run: python scripts/check_seo.py

      - name: Generate IndexNow payload from the sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET

          host = Path('CNAME').read_text().strip()
          key = 'grayforge-indexnow-20260612'
          namespace = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap = ET.parse('sitemap.xml')
          urls = [node.text for node in sitemap.findall('s:url/s:loc', namespace)]
          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'https://{host}/{key}.txt',
              'urlList': urls,
          }
          Path('/tmp/indexnow.json').write_text(json.dumps(payload))
          print(f'Prepared {len(urls)} sitemap URLs for IndexNow.')
          PY

      - name: Wait for IndexNow key deployment
        run: |
          curl --fail \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            https://grayforge.app/grayforge-indexnow-20260612.txt

      - name: Submit sitemap pages to IndexNow
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
